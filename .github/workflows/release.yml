name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        uses: crusty-pie/toolchain@v1

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rustilities-check-cache
          save-if: false

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }} 
        run: |
          cargo publish -p rustilities-procedural &&
          cargo publish -p rustilities
