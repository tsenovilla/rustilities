[package]
name = "rustilities-procedural"
version.workspace = true
repository.workspace = true 
license.workspace = true
rust-version.workspace = true
edition.workspace = true
description.workspace = true
documentation.workspace = true

[lib]
proc-macro = true

[dependencies]
quote = { workspace = true, optional = true }
proc-macro2 = { workspace = true, optional = true } 
syn = { workspace = true, features = ["full", "parsing", "extra-traits"], optional = true }

[dev-dependencies]
rustilities = { workspace = true, features = ["parsing", "universal-test-builder"]}
tokio = { workspace = true, features = ["time", "macros", "rt"] }
trybuild = { workspace = true }

[features]
paths = []
fmt = []
manifest = []
parsing = []
universal-test-builder = ["quote", "proc-macro2", "syn"]