[package]
name = "rustilities"
version = "3.0.1"
repository = "https://github.com/tsenovilla/rustilities"
license = "GPL-3.0"
edition = "2024"
description = "This crate offers a few utils for Rust development"
documentation = "https://docs.rs/rustilities"

[dependencies]
cargo_toml = { version = "0.22.3", optional = true }
thiserror = "2.0.11"
toml_edit = { version = "0.23.9", optional = true }
syn = { version = "2.0.98", features = ["full", "parsing", "extra-traits"], optional = true }
proc-macro2 = { version = "1.0.93", optional = true } 

[features]
paths = []
fmt = []
manifest = ["cargo_toml", "toml_edit", "paths"]
parsing = ["syn", "proc-macro2"]
universal-test-builder = []

[dev-dependencies]
tempfile = "3.16.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
